[project]
name = "deepfake-api"
version = "0.1.0"
description = "HTTP API (FastAPI) in front of the deepfake-core engine"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepfake-core",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "uvicorn>=0.32",
]

[project.scripts]
deepfake-api = "deepfake_api.__main__:main"

[tool.uv.sources]
deepfake-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
